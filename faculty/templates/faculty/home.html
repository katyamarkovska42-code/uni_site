{% extends "faculty/base.html" %}
{% block content %}
  {% if page %}
    <h1>{{ page.title }}</h1>
    <div class="card">{{ page.description|linebreaks }}</div>
    <h2>Контакти</h2>
    <div class="card">{{ page.contacts|linebreaks }}</div>
  {% else %}
    <p>Текст головної сторінки ще не додано в адмінці.</p>
  {% endif %}
{% endblock %}
